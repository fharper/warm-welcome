display_information:
  name: warm-welcome
  description: Welcome new members easily
features:
  bot_user:
    display_name: warm-welcome
    always_online: true
oauth_config:
  scopes:
    user:
      - chat:write
      - im:write
      - users:read
    bot:
      - im:write
      - users:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://YOUR-APP-DOMAIN-GOES.HERE/slack/events
    user_events:
      - team_join
    bot_events:
      - team_join
  interactivity:
    is_enabled: true
    request_url: https://YOUR-APP-DOMAIN-GOES.HERE/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
